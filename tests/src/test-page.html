<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rex-page-events test page</title>
</head>
<body>
    <h1>rex-page-events test page</h1>
    <div id="status">Loading…</div>

    <script type="module">
        // -----------------------------------------------------------------
        // Per-test state exposed on window
        // -----------------------------------------------------------------
        window.__runtimeMessageCalls = [];

        // -----------------------------------------------------------------
        // chrome.* mock
        // -----------------------------------------------------------------
        const listeners = {
            tabs: { created: [], updated: [], removed: [], activated: [] },
            windows: { removed: [], focusChanged: [] },
            storage: { changed: [] },
            runtime: { message: [] },
        };

        window.chrome = {
            runtime: {
                lastError: null,
                getManifest: () => ({ name: 'rex-page-events-test' }),
                sendMessage: async (message) => {
                    window.__runtimeMessageCalls.push(structuredClone(message));
                    // Route to the service-worker module under test.
                    if (window.__pageEventsServiceWorker) {
                        return new Promise((resolve) => {
                            // Simulate a content-script sender: give a fake tab id/window id.
                            const sender = window.__nextFakeSender || { tab: { id: 100, windowId: 1, url: location.href, title: document.title } };
                            const delivered = window.__pageEventsServiceWorker.handleMessage(
                                message,
                                sender,
                                resolve
                            );
                            if (!delivered) resolve({ success: true });
                        });
                    }
                    return { success: true };
                },
                onMessage: {
                    addListener: (cb) => listeners.runtime.message.push(cb),
                },
            },
            storage: {
                local: {
                    _data: {},
                    get: async (keys) => {
                        if (typeof keys === 'string') {
                            return { [keys]: window.chrome.storage.local._data[keys] };
                        }
                        if (Array.isArray(keys)) {
                            const result = {};
                            keys.forEach(k => { if (window.chrome.storage.local._data[k] !== undefined) result[k] = window.chrome.storage.local._data[k]; });
                            return result;
                        }
                        return { ...window.chrome.storage.local._data };
                    },
                    set: async (items) => {
                        Object.assign(window.chrome.storage.local._data, items);
                        const changes = {};
                        Object.keys(items).forEach(k => { changes[k] = { newValue: items[k], oldValue: undefined }; });
                        listeners.storage.changed.forEach(cb => cb(changes, 'local'));
                    },
                    remove: async (keys) => {
                        const arr = Array.isArray(keys) ? keys : [keys];
                        arr.forEach(k => delete window.chrome.storage.local._data[k]);
                    },
                    clear: async () => { window.chrome.storage.local._data = {}; },
                },
                onChanged: {
                    addListener: (cb) => listeners.storage.changed.push(cb),
                },
            },
            tabs: {
                onCreated: { addListener: (cb) => listeners.tabs.created.push(cb) },
                onUpdated: { addListener: (cb) => listeners.tabs.updated.push(cb) },
                onRemoved: { addListener: (cb) => listeners.tabs.removed.push(cb) },
                onActivated: { addListener: (cb) => listeners.tabs.activated.push(cb) },
            },
            windows: {
                WINDOW_ID_NONE: -1,
                onRemoved: { addListener: (cb) => listeners.windows.removed.push(cb) },
                onFocusChanged: { addListener: (cb) => listeners.windows.focusChanged.push(cb) },
            },
        };

        // -----------------------------------------------------------------
        // Helpers exposed to tests
        // -----------------------------------------------------------------
        window.__fireTabCreated = (tab) => listeners.tabs.created.forEach(cb => cb(tab));
        window.__fireTabUpdated = (tabId, changeInfo, tab) => listeners.tabs.updated.forEach(cb => cb(tabId, changeInfo, tab));
        window.__fireTabRemoved = (tabId, removeInfo) => listeners.tabs.removed.forEach(cb => cb(tabId, removeInfo));
        window.__fireTabActivated = (info) => listeners.tabs.activated.forEach(cb => cb(info));
        window.__fireWindowRemoved = (windowId) => listeners.windows.removed.forEach(cb => cb(windowId));
        window.__fireWindowFocusChanged = (windowId) => listeners.windows.focusChanged.forEach(cb => cb(windowId));

        window.__seedConfig = (pageEventsConfig) => {
            window.chrome.storage.local._data.REXConfiguration = { page_events: pageEventsConfig };
        };

        window.__resetAll = async () => {
            await window.chrome.storage.local.clear();
            if (window.__rexLists?.resetListDatabase) {
                await window.__rexLists.resetListDatabase();
            }
            window.__runtimeMessageCalls = [];
            if (window.__resetCapturedEvents) window.__resetCapturedEvents();
        };

        document.getElementById('status').textContent = 'Test environment ready';
        window.__testUtilitiesReady = true;
    </script>

    <script type="module" src="build/test-shim.bundle.js"></script>
</body>
</html>
